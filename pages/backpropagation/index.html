<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Backpropagation">
  <meta property="og:description" content="Interactive computational graph showing how gradients flow backward through the chain rule.">
  <meta property="og:url" content="https://emmaleonhart.com/backpropagation/">
  <title>Backpropagation & Computational Graphs</title>
    <!-- Shared visual identity: the ONE source of truth. /_identity/ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/identity.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 24px; }
    .container { max-width: 900px; width: 100%; }
    .back { display: inline-block; color: var(--accent); text-decoration: none; font-size: 0.9rem; margin-bottom: 24px; }
    .back:hover { text-decoration: underline; }
    h1 { font-size: 1.6rem; font-weight: 700; color: var(--text-strong); margin-bottom: 8px; letter-spacing: -0.3px; }
    .subtitle { color: var(--text-mute); font-size: 0.95rem; margin-bottom: 20px; line-height: 1.5; }
    .canvas-wrap { width: 100%; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 20px; background: var(--bg); }
    canvas { display: block; width: 100%; touch-action: none; }
    .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .ctrl-btn { padding: 8px 18px; background: var(--bg-card); border: 2px solid var(--border); border-radius: 8px; color: var(--text); font-family: var(--sans); font-size: 0.85rem; cursor: pointer; transition: all 0.15s; }
    .ctrl-btn:hover { border-color: var(--border-hover); background: var(--bg-elevated); }
    .ctrl-btn.active { border-color: var(--accent); background: rgba(124, 140, 248, 0.1); color: var(--text-strong); }
    .ctrl-btn.step-btn { border-color: #34d399; color: #34d399; }
    .ctrl-btn.step-btn:hover { background: rgba(52, 211, 153, 0.1); }
    .ctrl-sep { width: 1px; background: var(--border); align-self: stretch; margin: 0 4px; }
    .main-layout { display: flex; gap: 14px; align-items: flex-start; }
    .panel-left { flex: 0 0 200px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .panel-right { flex: 1; min-width: 0; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .section-label { font-size: 0.65rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
    .slider-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .slider-label { font-family: var(--mono); font-size: 0.78rem; color: var(--text); min-width: 20px; }
    .slider-val { font-family: var(--mono); font-size: 0.78rem; width: 40px; text-align: right; color: #34d399; }
    input[type="range"] { flex: 1; accent-color: var(--accent); height: 4px; }
    .eq-section { background: var(--bg-soft); border-radius: 6px; padding: 10px 14px; margin-bottom: 10px; }
    .eq-title { font-size: 0.75rem; font-weight: 600; margin-bottom: 6px; }
    .eq-line { font-family: var(--mono); font-size: 0.75rem; color: var(--text-mute); line-height: 1.8; }
    .eq-line.important { background: rgba(245, 158, 11, 0.06); padding: 2px 6px; border-radius: 3px; }
    .val-pos { color: #34d399; } .val-neg { color: #f43f5e; } .val-zero { color: var(--text-faint); }
    .grad-val { color: #f59e0b; font-weight: 700; }
    .insight-box { margin-top: 14px; padding: 10px 12px; background: rgba(124, 140, 248, 0.04); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; font-size: 0.82rem; line-height: 1.5; color: var(--text-mute); }
    @media (max-width: 700px) { .main-layout { flex-wrap: wrap; } .panel-left { flex: 1 1 100%; } .panel-right { flex: 1 1 100%; } }
    @media (max-width: 480px) { body { padding: 24px 12px; } h1 { font-size: 1.3rem; } }
  </style>
  <!-- Canonical identity: theme before first paint (dark default). See /_identity/. -->
  <script>(function(){try{var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark')t='dark';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle light and dark theme" title="Toggle light / dark">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9M12,2L14.39,5.42C13.65,5.15 12.84,5 12,5C11.16,5 10.35,5.15 9.61,5.42L12,2M3.34,7L7.5,6.65C6.9,7.16 6.36,7.78 5.94,8.5C5.5,9.24 5.25,10 5.11,10.79L3.34,7M3.36,17L5.12,13.23C5.26,14 5.53,14.78 5.95,15.5C6.37,16.24 6.91,16.86 7.5,17.37L3.36,17M20.65,7L18.88,10.79C18.74,10 18.47,9.23 18.05,8.5C17.63,7.78 17.1,7.15 16.5,6.64L20.65,7M20.64,17L16.5,17.36C17.09,16.85 17.62,16.22 18.04,15.5C18.46,14.77 18.73,14 18.87,13.21L20.64,17M12,22L9.59,18.56C10.33,18.83 11.14,19 12,19C12.82,19 13.63,18.86 14.37,18.59L12,22Z"></path></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.75,4.09L15.22,6.03L16.13,9.09L13.5,7.28L10.87,9.09L11.78,6.03L9.25,4.09L12.44,4L13.5,1L14.56,4L17.75,4.09M21.25,11L19.61,12.25L20.2,14.23L18.5,13.06L16.8,14.23L17.39,12.25L15.75,11L17.81,10.95L18.5,9L19.19,10.95L21.25,11M18.97,15.95C19.8,15.87 20.69,17.05 20.16,17.8C19.84,18.25 19.5,18.67 19.08,19.07C15.17,23 8.84,23 4.94,19.07C1.03,15.17 1.03,8.83 4.94,4.93C5.34,4.53 5.76,4.17 6.21,3.85C6.96,3.32 8.14,4.21 8.06,5.04C7.79,7.9 8.75,10.87 10.95,13.06C13.14,15.26 16.1,16.22 18.97,15.95M17.33,17.97C14.5,17.81 11.7,16.64 9.53,14.5C7.36,12.31 6.2,9.5 6.04,6.68C3.23,9.82 3.34,14.4 6.35,17.41C9.37,20.43 14,20.54 17.33,17.97Z"></path></svg>
  </button>

  <div class="container">
    <a class="back" href="/">&larr; Home</a>
    <h1>Backpropagation & Computational Graphs</h1>
    <p class="subtitle">A computational graph for y&#770; = &sigma;(w&middot;x + b) with MSE loss. Adjust inputs and weights, then toggle backward pass to see gradients flow via the chain rule. Click "Gradient step" to apply one update.</p>
    <div class="controls">
      <button class="ctrl-btn active" id="btn-forward">Forward pass</button>
      <button class="ctrl-btn" id="btn-backward">Show backward pass</button>
      <div class="ctrl-sep"></div>
      <button class="ctrl-btn" data-label="1">y = 1</button>
      <button class="ctrl-btn active" data-label="0">y = 0</button>
      <div class="ctrl-sep"></div>
      <button class="ctrl-btn step-btn" id="btn-step">Gradient step</button>
    </div>
    <div class="canvas-wrap"><canvas id="canvas"></canvas></div>
    <div class="main-layout">
      <div class="panel-left">
        <div class="section-label">Parameters</div>
        <div class="slider-row">
          <span class="slider-label">x</span>
          <input type="range" id="slider-x" min="-2" max="2" step="0.05">
          <span class="slider-val" id="slider-x-val">0.50</span>
        </div>
        <div class="slider-row">
          <span class="slider-label">w</span>
          <input type="range" id="slider-w" min="-3" max="3" step="0.05">
          <span class="slider-val" id="slider-w-val">0.80</span>
        </div>
        <div class="slider-row">
          <span class="slider-label">b</span>
          <input type="range" id="slider-b" min="-3" max="3" step="0.05">
          <span class="slider-val" id="slider-b-val">-0.20</span>
        </div>
      </div>
      <div class="panel-right">
        <div class="section-label">Equations</div>
        <div id="math-panel"></div>
      </div>
    </div>
  </div>
  <script type="module" src="main.js"></script>
  <script>(function(){var b=document.getElementById('theme-toggle');if(!b)return;b.addEventListener('click',function(){var c=document.documentElement.getAttribute('data-theme')==='light'?'light':'dark';var n=c==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('theme',n);}catch(e){}});})();</script>
</body>
</html>
