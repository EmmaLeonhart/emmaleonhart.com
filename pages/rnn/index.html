<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Recurrent Neural Network">
  <meta property="og:description" content="Interactive demo of how RNNs process sequences — watch hidden state carry memory from one time step to the next.">
  <meta property="og:url" content="https://emmaleonhart.com/rnn/">
  <meta name="description" content="Interactive recurrent neural network visualizer. See how hidden states flow through time, carrying information from earlier inputs to later outputs.">
  <title>Recurrent Neural Network</title>
  <style>
    /* ===== CANONICAL VISUAL IDENTITY (see /_identity/) ==============
       Lacquer tokens; dark is default, [data-theme="light"] flips them.
       Slate chrome hexes in this stylesheet were rewritten to var(). */
    :root {
      --bg: #07070c;
      --bg-soft: #0c0c14;
      --bg-card: #11111b;
      --bg-elevated: #14141f;
      --border: #1d1d2c;
      --border-hover: #34344e;
      --border-strong: #262638;
      --text: #d4d4e0;
      --text-strong: #f0f0f6;
      --text-mute: #8c8caa;
      --text-faint: #5d5d78;
      --accent: #8b9bff;
      --accent-bright: #b0bcff;
      --accent-soft: rgba(139, 155, 255, 0.10);
      --accent-glow: rgba(139, 155, 255, 0.28);
    }
    html[data-theme="light"] {
      --bg: #f4f4f8;
      --bg-soft: #ebebf2;
      --bg-card: #ffffff;
      --bg-elevated: #fbfbfe;
      --border: #dadae6;
      --border-hover: #b6b6cf;
      --border-strong: #c7c7d8;
      --text: #2b2b38;
      --text-strong: #14141f;
      --text-mute: #5c5c74;
      --text-faint: #8c8caa;
      --accent: #5160dd;
      --accent-bright: #3a48c4;
      --accent-soft: rgba(81, 96, 221, 0.10);
      --accent-glow: rgba(81, 96, 221, 0.22);
    }
    body { transition: background 0.35s ease, color 0.35s ease; }
    .theme-toggle {
      position: fixed; top: 18px; right: 18px; z-index: 200;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 999px; color: var(--text-mute); cursor: pointer;
      transition: color .2s, border-color .2s, background .2s, transform .2s;
    }
    .theme-toggle:hover {
      color: var(--accent-bright); border-color: var(--accent);
      background: var(--accent-soft); transform: translateY(-1px);
    }
    .theme-toggle svg { width: 18px; height: 18px; display: none; }
    html[data-theme="dark"]  .theme-toggle .icon-sun  { display: block; }
    html[data-theme="light"] .theme-toggle .icon-moon { display: block; }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px;
    }
    .container { max-width: 960px; width: 100%; }
    .back {
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .back:hover { text-decoration: underline; }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-strong);
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }
    .subtitle {
      color: var(--text-mute);
      font-size: 0.95rem;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .canvas-wrap {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
      background: var(--bg);
    }
    canvas {
      display: block;
      width: 100%;
      touch-action: none;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .ctrl-btn {
      padding: 8px 18px;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .ctrl-btn:hover {
      border-color: var(--border-hover);
      background: var(--bg-elevated);
    }
    .ctrl-btn.active {
      border-color: var(--accent);
      background: rgba(124, 140, 248, 0.1);
      color: var(--text-strong);
    }
    .ctrl-sep {
      width: 1px;
      background: var(--border);
      align-self: stretch;
      margin: 0 4px;
    }
    .main-layout {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .panel-left {
      flex: 0 0 200px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      max-height: 500px;
      overflow-y: auto;
    }
    .panel-right {
      flex: 1;
      min-width: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      max-height: 500px;
      overflow-y: auto;
    }
    .section-label {
      font-size: 0.65rem;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }
    .step-inputs {
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .step-inputs:last-child { border-bottom: none; }
    .step-label {
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.72rem;
      color: #f59e0b;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .slider-label {
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.72rem;
      color: var(--text);
      min-width: 20px;
      flex-shrink: 0;
    }
    .slider-val {
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.72rem;
      width: 36px;
      text-align: right;
      flex-shrink: 0;
    }
    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 4px;
    }
    .step-card {
      background: var(--bg-soft);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .step-card:hover { border-color: var(--border-hover); }
    .step-card.active {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.04);
    }
    .step-title {
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.8rem;
      color: #f59e0b;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .neuron-line {
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.7rem;
      color: var(--text-mute);
      line-height: 1.8;
      word-break: break-all;
    }
    .out-line {
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px solid var(--border);
    }
    .val-pos { color: #34d399; }
    .val-neg { color: #f43f5e; }
    .val-zero { color: var(--text-faint); }
    .insight-box {
      margin-top: 14px;
      padding: 10px 12px;
      background: rgba(245, 158, 11, 0.04);
      border-left: 3px solid #f59e0b;
      border-radius: 0 6px 6px 0;
      font-size: 0.82rem;
      line-height: 1.5;
      color: var(--text-mute);
    }
    @media (max-width: 700px) {
      .main-layout { flex-wrap: wrap; }
      .panel-left { flex: 1 1 100%; max-height: 300px; }
      .panel-right { flex: 1 1 100%; }
    }
    @media (max-width: 480px) {
      body { padding: 24px 12px; }
      h1 { font-size: 1.3rem; }
    }
  </style>
  <!-- Canonical identity: theme before first paint (dark default). See /_identity/. -->
  <script>(function(){try{var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark')t='dark';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle light and dark theme" title="Toggle light / dark">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>

  <div class="container">
    <a class="back" href="/">&larr; Home</a>
    <h1>Recurrent Neural Network</h1>
    <p class="subtitle">RNNs process sequences step by step, carrying a hidden state forward through time. The same weights are shared at every step — the network learns to <em>remember</em>. Click a time step card to highlight it.</p>
    <div class="controls">
      <button class="ctrl-btn active" data-fn="tanh">Tanh</button>
      <button class="ctrl-btn" data-fn="relu">ReLU</button>
      <div class="ctrl-sep"></div>
      <button class="ctrl-btn" data-steps="2">2 steps</button>
      <button class="ctrl-btn active" data-steps="3">3 steps</button>
      <button class="ctrl-btn" data-steps="4">4 steps</button>
      <button class="ctrl-btn" data-steps="5">5 steps</button>
      <div class="ctrl-sep"></div>
      <button class="ctrl-btn" id="btn-randomize">Randomize</button>
    </div>
    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
    </div>
    <div class="main-layout">
      <div class="panel-left">
        <div class="section-label">Inputs per step</div>
        <div id="input-sliders"></div>
      </div>
      <div class="panel-right">
        <div class="section-label">Forward pass (click to highlight)</div>
        <div id="math-panel"></div>
      </div>
    </div>
  </div>
  <script type="module" src="main.js"></script>
  <script>(function(){var b=document.getElementById('theme-toggle');if(!b)return;b.addEventListener('click',function(){var c=document.documentElement.getAttribute('data-theme')==='light'?'light':'dark';var n=c==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('theme',n);}catch(e){}});})();</script>
</body>
</html>
