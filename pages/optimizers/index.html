<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Optimizer Comparison">
  <meta property="og:description" content="Interactive 2D visualization of gradient descent optimizers (GD, SGD, Momentum, AdaGrad, RMSProp, Adam, AdamW) racing on different loss surfaces.">
  <meta property="og:url" content="https://emmaleonhart.com/optimizers/">
  <title>Optimizer Comparison</title>
  <style>
    /* ===== CANONICAL VISUAL IDENTITY (see /_identity/) ==============
       Lacquer tokens; dark is default, [data-theme="light"] flips them.
       Slate chrome hexes in this stylesheet were rewritten to var(). */
    :root {
      --bg: #07070c;
      --bg-soft: #0c0c14;
      --bg-card: #11111b;
      --bg-elevated: #14141f;
      --border: #1d1d2c;
      --border-hover: #34344e;
      --border-strong: #262638;
      --text: #d4d4e0;
      --text-strong: #f0f0f6;
      --text-mute: #8c8caa;
      --text-faint: #5d5d78;
      --accent: #8b9bff;
      --accent-bright: #b0bcff;
      --accent-soft: rgba(139, 155, 255, 0.10);
      --accent-glow: rgba(139, 155, 255, 0.28);
    }
    html[data-theme="light"] {
      --bg: #f4f4f8;
      --bg-soft: #ebebf2;
      --bg-card: #ffffff;
      --bg-elevated: #fbfbfe;
      --border: #dadae6;
      --border-hover: #b6b6cf;
      --border-strong: #c7c7d8;
      --text: #2b2b38;
      --text-strong: #14141f;
      --text-mute: #5c5c74;
      --text-faint: #8c8caa;
      --accent: #5160dd;
      --accent-bright: #3a48c4;
      --accent-soft: rgba(81, 96, 221, 0.10);
      --accent-glow: rgba(81, 96, 221, 0.22);
    }
    body { transition: background 0.35s ease, color 0.35s ease; }
    .theme-toggle {
      position: fixed; top: 18px; right: 18px; z-index: 200;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 999px; color: var(--text-mute); cursor: pointer;
      transition: color .2s, border-color .2s, background .2s, transform .2s;
    }
    .theme-toggle:hover {
      color: var(--accent-bright); border-color: var(--accent);
      background: var(--accent-soft); transform: translateY(-1px);
    }
    .theme-toggle svg { width: 18px; height: 18px; display: none; }
    html[data-theme="dark"]  .theme-toggle .icon-sun  { display: block; }
    html[data-theme="light"] .theme-toggle .icon-moon { display: block; }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 24px; }
    .container { max-width: 960px; width: 100%; }
    .back { display: inline-block; color: var(--accent); text-decoration: none; font-size: 0.9rem; margin-bottom: 24px; }
    .back:hover { text-decoration: underline; }
    h1 { font-size: 1.6rem; font-weight: 700; color: var(--text-strong); margin-bottom: 8px; letter-spacing: -0.3px; }
    .subtitle { color: var(--text-mute); font-size: 0.95rem; margin-bottom: 20px; line-height: 1.5; }
    .canvas-wrap { width: 100%; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 16px; background: var(--bg); }
    canvas { display: block; width: 100%; touch-action: none; }
    .controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
    .ctrl-btn { padding: 6px 14px; background: var(--bg-card); border: 2px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; }
    .ctrl-btn:hover { border-color: var(--border-hover); background: var(--bg-elevated); }
    .ctrl-btn.active { border-color: var(--accent); background: rgba(124, 140, 248, 0.1); color: var(--text-strong); }
    .opt-btn { padding: 6px 14px; background: var(--bg-card); border: 2px solid var(--border); border-radius: 8px; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; }
    .opt-btn:hover { border-color: var(--border-hover); background: var(--bg-elevated); }
    .opt-btn.active { border-color: var(--opt-color, var(--accent)); background: rgba(124, 140, 248, 0.08); color: var(--text-strong); }
    .ctrl-sep { width: 1px; background: var(--border); align-self: stretch; margin: 0 4px; }
    .slider-group { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--text-mute); }
    .slider-group input { width: 80px; accent-color: var(--accent); }
    .slider-group span { font-family: 'Cascadia Code', monospace; width: 40px; }
    .info-row { display: flex; gap: 14px; align-items: flex-start; }
    .info-panel { flex: 1; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; min-width: 0; }
    .section-label { font-size: 0.65rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
    #info-panel { font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 0.78rem; color: var(--text-mute); line-height: 1.8; }
    #insight-box { padding: 10px 12px; background: rgba(124, 140, 248, 0.04); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; font-size: 0.82rem; line-height: 1.5; color: var(--text-mute); }
    @media (max-width: 700px) { .info-row { flex-direction: column; } }
    @media (max-width: 480px) { body { padding: 24px 12px; } h1 { font-size: 1.3rem; } .controls { gap: 5px; } }
  </style>
  <!-- Canonical identity: theme before first paint (dark default). See /_identity/. -->
  <script>(function(){try{var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark')t='dark';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle light and dark theme" title="Toggle light / dark">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9M12,2L14.39,5.42C13.65,5.15 12.84,5 12,5C11.16,5 10.35,5.15 9.61,5.42L12,2M3.34,7L7.5,6.65C6.9,7.16 6.36,7.78 5.94,8.5C5.5,9.24 5.25,10 5.11,10.79L3.34,7M3.36,17L5.12,13.23C5.26,14 5.53,14.78 5.95,15.5C6.37,16.24 6.91,16.86 7.5,17.37L3.36,17M20.65,7L18.88,10.79C18.74,10 18.47,9.23 18.05,8.5C17.63,7.78 17.1,7.15 16.5,6.64L20.65,7M20.64,17L16.5,17.36C17.09,16.85 17.62,16.22 18.04,15.5C18.46,14.77 18.73,14 18.87,13.21L20.64,17M12,22L9.59,18.56C10.33,18.83 11.14,19 12,19C12.82,19 13.63,18.86 14.37,18.59L12,22Z"></path></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.75,4.09L15.22,6.03L16.13,9.09L13.5,7.28L10.87,9.09L11.78,6.03L9.25,4.09L12.44,4L13.5,1L14.56,4L17.75,4.09M21.25,11L19.61,12.25L20.2,14.23L18.5,13.06L16.8,14.23L17.39,12.25L15.75,11L17.81,10.95L18.5,9L19.19,10.95L21.25,11M18.97,15.95C19.8,15.87 20.69,17.05 20.16,17.8C19.84,18.25 19.5,18.67 19.08,19.07C15.17,23 8.84,23 4.94,19.07C1.03,15.17 1.03,8.83 4.94,4.93C5.34,4.53 5.76,4.17 6.21,3.85C6.96,3.32 8.14,4.21 8.06,5.04C7.79,7.9 8.75,10.87 10.95,13.06C13.14,15.26 16.1,16.22 18.97,15.95M17.33,17.97C14.5,17.81 11.7,16.64 9.53,14.5C7.36,12.31 6.2,9.5 6.04,6.68C3.23,9.82 3.34,14.4 6.35,17.41C9.37,20.43 14,20.54 17.33,17.97Z"></path></svg>
  </button>

  <div class="container">
    <a class="back" href="/">&larr; Home</a>
    <h1>Optimizer Comparison</h1>
    <p class="subtitle">Watch seven optimizers race across a loss surface. Each uses a different strategy to find the minimum. Toggle optimizers and surfaces to compare their behavior.</p>
    <div class="controls">
      <button class="ctrl-btn active" data-surface="bowl">Bowl</button>
      <button class="ctrl-btn" data-surface="valley">Valley</button>
      <button class="ctrl-btn" data-surface="saddle">Saddle</button>
      <button class="ctrl-btn" data-surface="beale">Beale</button>
      <div class="ctrl-sep"></div>
      <button class="ctrl-btn" id="btn-play">Play</button>
      <button class="ctrl-btn" id="btn-reset">Reset</button>
    </div>
    <div class="controls">
      <button class="opt-btn active" data-opt="gd" style="--opt-color:#7c8cf8; color:#7c8cf8">GD</button>
      <button class="opt-btn active" data-opt="sgd" style="--opt-color:#38bdf8; color:#38bdf8">SGD</button>
      <button class="opt-btn active" data-opt="momentum" style="--opt-color:#a78bfa; color:#a78bfa">Momentum</button>
      <button class="opt-btn active" data-opt="adagrad" style="--opt-color:#f59e0b; color:#f59e0b">AdaGrad</button>
      <button class="opt-btn active" data-opt="rmsprop" style="--opt-color:#f43f5e; color:#f43f5e">RMSProp</button>
      <button class="opt-btn active" data-opt="adam" style="--opt-color:#34d399; color:#34d399">Adam</button>
      <button class="opt-btn active" data-opt="adamw" style="--opt-color:#fb923c; color:#fb923c">AdamW</button>
      <div class="ctrl-sep"></div>
      <div class="slider-group">LR: <input type="range" id="lr-slider" min="0.001" max="0.5" step="0.001" value="0.05"> <span id="lr-val">0.050</span></div>
      <div class="slider-group">Speed: <input type="range" id="speed-slider" min="1" max="10" step="1" value="3"> </div>
    </div>
    <div class="canvas-wrap"><canvas id="canvas"></canvas></div>
    <div class="info-row">
      <div class="info-panel">
        <div class="section-label">Optimizer Status</div>
        <div id="info-panel"></div>
      </div>
      <div class="info-panel">
        <div id="insight-box"></div>
      </div>
    </div>
  </div>
  <script type="module" src="main.js"></script>
  <script>(function(){var b=document.getElementById('theme-toggle');if(!b)return;b.addEventListener('click',function(){var c=document.documentElement.getAttribute('data-theme')==='light'?'light':'dark';var n=c==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('theme',n);}catch(e){}});})();</script>
</body>
</html>
