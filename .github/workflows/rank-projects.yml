name: Rank projects by GitHub stars

# Re-ranks the project list (and the top-bar dropdown) by live GitHub star
# counts, with data/projects.json's "vibes" field as the tiebreaker. Runs
# weekly + on demand; commits only when the order/copy actually changed.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

concurrency:
  group: rank-projects
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Rank and regenerate the AUTO regions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/rank_projects.py
      - name: Commit if the ranking changed
        run: |
          if [ -n "$(git status --porcelain pages/projects/index.html pages/index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pages/projects/index.html pages/index.html
            git commit -m "chore: re-rank projects by GitHub stars (automated)"
            git push
          else
            echo "Ranking unchanged — nothing to commit."
          fi
