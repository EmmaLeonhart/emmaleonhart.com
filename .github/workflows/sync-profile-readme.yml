# Push-from-here fallback: keeps EmmaLeonhart/EmmaLeonhart's profile
# README in sync with the canonical bio (github_bio/readme.md) in THIS
# repo, regardless of whether the profile repo's own
# sync-from-website.yml is working/enabled.
#
# REQUIRES (one-time, by Emma):
#   - Repo secret PROFILE_README_TOKEN: a fine-grained PAT with
#     contents:write on EmmaLeonhart/EmmaLeonhart. Set at
#     https://github.com/EmmaLeonhart/emmaleonhart.com/settings/secrets/actions
#   - GitHub Actions enabled on EmmaLeonhart/EmmaLeonhart:
#     https://github.com/EmmaLeonhart/EmmaLeonhart/settings/actions
#
# The profile README is only touched between the BIO:START/BIO:END
# markers; everything else there is preserved. Markers are added on the
# first sync if absent. Commits/pushes only when the region changed.

name: sync-profile-readme

on:
  schedule:
    - cron: "17 14 * * *"
  push:
    branches: [master, main]
    paths:
      - "github_bio/readme.md"
      - ".github/workflows/sync-profile-readme.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-profile-readme
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout emmaleonhart.com (bio source)
        uses: actions/checkout@v4
        with:
          path: site

      - name: Checkout profile repo
        uses: actions/checkout@v4
        with:
          repository: EmmaLeonhart/EmmaLeonhart
          token: ${{ secrets.PROFILE_README_TOKEN }}
          path: profile

      - name: Sync bio into profile README between markers
        run: |
          python3 - <<'PY'
          import pathlib, sys

          START = "<!-- BIO:START -->"
          END = "<!-- BIO:END -->"

          bio = pathlib.Path("site/github_bio/readme.md").read_text(encoding="utf-8").strip()
          block = f"{START}\n{bio}\n{END}"

          readme = pathlib.Path("profile/README.md")
          old = readme.read_text(encoding="utf-8") if readme.exists() else ""

          if START in old and END in old:
              pre = old[: old.index(START)]
              post = old[old.index(END) + len(END):]
              new = pre + block + post
          elif old.strip():
              # README exists but has no markers: wrap the bio block on
              # top, preserve everything already there below it.
              new = block + "\n\n" + old.lstrip()
          else:
              new = block + "\n"

          if new != old:
              readme.write_text(new, encoding="utf-8")
              print("changed")
          else:
              print("unchanged")
          PY

      - name: Commit + push if changed
        run: |
          cd profile
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Sync profile README from emmaleonhart.com/github_bio (automated)"
            git push
            echo "Profile README synced."
          else
            echo "No change; nothing to push."
          fi
